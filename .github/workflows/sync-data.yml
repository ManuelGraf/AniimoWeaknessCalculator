name: Refresh Aniimo data

# The wiki gains new Aniimo and forms over time. This re-scrapes on a schedule,
# commits anything that changed, and then deploys.
on:
  schedule:
    - cron: '17 4 * * 1' # Mondays, 04:17 UTC
  workflow_dispatch:
    inputs:
      wikiOnly:
        description: 'Use only the official wiki as a source'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # sync exits non-zero only if the weakness data itself is unusable (forms
      # with no or unknown elements, a roster that shrank, chart drift). Gaps in
      # moves or artwork are warnings and still ship.
      - name: Scrape sources
        run: npm run ${{ inputs.wikiOnly && 'sync:wiki' || 'sync' }}

      # Tests read a frozen snapshot (test/fixtures), so this checks the code,
      # not whatever the sources returned today.
      - name: Verify the app still builds and passes
        run: npm test

      - name: Commit if anything changed
        id: commit
        run: |
          if git diff --quiet -- public/data; then
            echo "No changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git commit -m "chore(data): refresh Aniimo database"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # Called explicitly: the commit above cannot trigger the deploy on its own.
  deploy:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
